name: Mac and backend regression checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'package*.json'
      - '.github/workflows/mac-check.yml'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 'v2.9.6'
      - name: Install declared dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate licensed speech and build configuration
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Test the native app, including bundled audio decoding
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Check native and UI source
        run: |
          npm run check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test cloud helpers without accounts or provider calls
        run: npm run test:backend

  quota-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install disposable database prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
      - name: Test migrations, permissions, quotas and concurrent claims
        run: python3 scripts/test-backend-sql.py --postgres-bin "$(pg_config --bindir)"
