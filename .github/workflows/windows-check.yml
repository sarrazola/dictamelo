name: Windows builds and regression checks

on:
  workflow_dispatch:
    inputs:
      official_cloud:
        description: Include official public cloud metadata from repository variables
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'ui/**'
      - 'package*.json'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - '.github/workflows/windows-check.yml'

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64
            machine: '0x8664'
          - target: aarch64-pc-windows-msvc
            arch: aarch64
            machine: '0xaa64'
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build prerequisites
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          Add-Content $env:GITHUB_PATH 'C:\Program Files\NASM'
          rustup target add x86_64-pc-windows-msvc ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed' }
          if ('${{ matrix.arch }}' -eq 'aarch64') {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products * -property installationPath
            $arm = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
            if (-not $arm) {
              $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
              $process = Start-Process $installer -ArgumentList @('modify','--installPath',"`"$vs`"",'--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64','--quiet','--norestart') -Wait -PassThru
              if ($process.ExitCode -notin @(0,3010)) { throw 'MSVC ARM64 installation failed' }
            }
            Add-Content $env:GITHUB_PATH "$vs\VC\Tools\Llvm\x64\bin"
          }
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Validate the committed speech fixture and build configuration
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Fixture/configuration tests failed' }
          node --check ui/main.js
          if ($LASTEXITCODE -ne 0) { throw 'UI syntax check failed' }
          node --check ui/i18n.js
          if ($LASTEXITCODE -ne 0) { throw 'Translation syntax check failed' }
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { throw 'UI translation/control contract tests failed' }
      - name: Validate optional official build metadata
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.official_cloud }}
        shell: pwsh
        env:
          DICTAMELO_SUPABASE_URL: ${{ vars.DICTAMELO_SUPABASE_URL }}
          DICTAMELO_SUPABASE_ANON_KEY: ${{ vars.DICTAMELO_SUPABASE_ANON_KEY }}
          DICTAMELO_LEMON_STORE_ID: ${{ vars.DICTAMELO_LEMON_STORE_ID }}
          DICTAMELO_LEMON_PRODUCT_ID: ${{ vars.DICTAMELO_LEMON_PRODUCT_ID }}
          DICTAMELO_LEMON_VARIANT_IDS: ${{ vars.DICTAMELO_LEMON_VARIANT_IDS }}
          DICTAMELO_CHECKOUT_URL: ${{ vars.DICTAMELO_CHECKOUT_URL }}
        run: |
          $names = @('DICTAMELO_SUPABASE_URL','DICTAMELO_SUPABASE_ANON_KEY','DICTAMELO_LEMON_STORE_ID','DICTAMELO_LEMON_PRODUCT_ID','DICTAMELO_LEMON_VARIANT_IDS','DICTAMELO_CHECKOUT_URL')
          $lines = $names | ForEach-Object { "$_=$([Environment]::GetEnvironmentVariable($_))" }
          $lines += @('DICTAMELO_PRO_TRIAL_AVAILABLE=false','DICTAMELO_UPDATES_ENABLED=true')
          [IO.File]::WriteAllLines((Join-Path $pwd '.env.cloud-build'), $lines)
          python scripts/with-cloud-config.py --config .env.cloud-build -- python -c "print('Official public configuration validated')"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid official public build configuration' }
      - name: Test on native x64 Windows
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'This check requires native x64 Windows' }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
      - name: Build an unsigned verification installer
        shell: pwsh
        run: |
          if (Test-Path '.env.cloud-build') {
            python scripts/with-cloud-config.py --config .env.cloud-build -- cmd /c npx tauri build --target ${{ matrix.target }} --bundles nsis --no-sign
          } else {
            npx tauri build --target ${{ matrix.target }} --bundles nsis --no-sign
          }
          if ($LASTEXITCODE -ne 0) { throw 'NSIS build failed' }
          $exe = 'src-tauri/target/${{ matrix.target }}/release/dictamelo.exe'
          $bundleDir = 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis'
          $installers = @(Get-ChildItem $bundleDir -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer for this target' }
          $installer = $installers[0]
          # Use the runner's existing tool; never install another extractor or run the payload.
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path $sevenZip -PathType Leaf)) { throw 'The Windows runner must provide 7-Zip' }
          $extracted = Join-Path $env:RUNNER_TEMP ('dictamelo-nsis-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $extracted | Out-Null
          & $sevenZip x -y "-o$extracted" $installer.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS payload extraction failed' }
          $payloads = @(Get-ChildItem $extracted -Recurse -File -Filter 'dictamelo.exe')
          if ($payloads.Count -ne 1) { throw 'Expected exactly one packaged dictamelo.exe' }
          $packaged = $payloads[0].FullName

          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a three-part numeric release version' }
          $expectedVersion = "$version.0"
          $compiledInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe).Path)
          $packagedInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($packaged)
          foreach ($info in @($compiledInfo, $packagedInfo)) {
            $fileVersion = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
            $productVersion = '{0}.{1}.{2}.{3}' -f $info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart
            if (-not $info.FileVersion -or -not $info.ProductVersion -or $fileVersion -ne $expectedVersion -or $productVersion -ne $expectedVersion) {
              throw 'Compiler output or packaged payload version does not match the release manifest'
            }
          }
          # The output exe is restored by Tauri after packaging; only its UNK-to-NSS
          # marker may differ from the extracted payload. The helper never edits either file.
          $payloadJson = python scripts/windows_payload.py --compiled $exe --packaged $packaged --machine '${{ matrix.machine }}'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS packaged payload verification failed' }
          $metadata = $payloadJson | ConvertFrom-Json -AsHashtable
          $metadata.commit = '${{ github.sha }}'
          $metadata.target = '${{ matrix.target }}'
          $metadata.version = $version
          $metadata.compiledFileVersion = $compiledInfo.FileVersion
          $metadata.compiledProductVersion = $compiledInfo.ProductVersion
          $metadata.packagedFileVersion = $packagedInfo.FileVersion
          $metadata.packagedProductVersion = $packagedInfo.ProductVersion
          $metadata.installerFilename = $installer.Name
          $metadata.installerBytes = $installer.Length
          $metadata.installerSha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata.testsExecutedOn = 'native x64 Windows runner'
          $metadata.targetExecution = '${{ matrix.arch }}' -eq 'x86_64'
          $metadata.officialCloud = Test-Path '.env.cloud-build'
          $metadata | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $bundleDir 'build-verification.json')
          Write-Output "Verified ${{ matrix.arch }} compiled and NSIS-packaged payloads, versions and exact bundle-marker transformation"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}-verification-only
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/build-verification.json
          retention-days: 7
          if-no-files-found: error
