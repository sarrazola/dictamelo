<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dictámelo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="icon.png" alt="">
      <span class="brand-name">Dictámelo</span>
    </div>

    <nav id="nav">
      <button class="nav-item" data-page="general">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--card)"/>
          <circle cx="15" cy="12" r="2" fill="var(--card)"/><circle cx="8" cy="18" r="2" fill="var(--card)"/>
        </svg>
        <span data-i18n="nav.general"></span>
      </button>
      <button class="nav-item" data-page="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8l2.6 5.5 6 .9-4.3 4.3 1 6.1-5.3-2.9-5.3 2.9 1-6.1L3.4 9.2l6-.9z"/>
        </svg>
        <span data-i18n="nav.plan"></span>
      </button>
      <button class="nav-item" data-page="models">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <rect x="7" y="7" width="10" height="10" rx="2.5"/>
          <path d="M10 3v3M14 3v3M10 18v3M14 18v3M3 10h3M3 14h3M18 10h3M18 14h3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="nav.models"></span>
      </button>
      <button class="nav-item" data-page="files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
        </svg>
        <span data-i18n="nav.files"></span>
      </button>
      <button class="nav-item" data-page="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4h4"/><path d="M12 7.5V12l3 1.8"/>
        </svg>
        <span data-i18n="nav.history"></span>
      </button>
      <button class="nav-item" data-page="advanced">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>
        <span data-i18n="nav.advanced"></span>
      </button>
      <button class="nav-item" data-page="about">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
        <span data-i18n="nav.about"></span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <span id="foot-dot" class="foot-dot"></span>
      <span id="foot-model" class="foot-model"></span>
      <span id="foot-version" class="foot-version"></span>
    </div>
  </aside>

  <main class="content">
    <header class="page-head">
      <div>
        <h1 id="page-title"></h1>
        <p id="page-sub"></p>
      </div>
      <div id="status-pill" class="pill idle"><span class="dot"></span><span id="status-text"></span></div>
    </header>

    <div id="perm-banner" class="banner" hidden>
      <div class="banner-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M12 3.5 3.5 19h17L12 3.5Z"/><path d="M12 10v4"/><circle cx="12" cy="16.8" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <div><strong data-i18n="perm.title"></strong><span data-i18n="perm.desc"></span></div>
      </div>
      <div id="perm-rows"></div>
    </div>

    <!-- General -->
    <section class="page" data-page="general">
      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="general.shortcut"></strong><span data-i18n="general.shortcut.desc"></span></div>
          <div class="actions">
            <button id="hotkey-display" class="keycap"></button>
            <button id="btn-change-hotkey" class="ghost"></button>
            <button id="btn-reset-hotkey" class="ghost icon" title="reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4h4"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="hint" id="hotkey-hint"></p>
      </div>

      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="general.autopaste"></strong><span data-i18n="general.autopaste.desc"></span></div>
          <div class="actions"><label class="switch"><input type="checkbox" id="auto-paste"><span class="track"></span></label></div>
        </div>
        <div class="row">
          <div class="label"><strong data-i18n="general.dictlang"></strong><span data-i18n="general.dictlang.desc"></span></div>
          <div class="actions"><select id="language"></select></div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="general.launch"></strong><span data-i18n="general.launch.desc"></span></div>
          <div class="actions"><label class="switch"><input type="checkbox" id="launch-at-login"><span class="track"></span></label></div>
        </div>
        <div class="row">
          <div class="label"><strong data-i18n="general.sounds"></strong><span data-i18n="general.sounds.desc"></span></div>
          <div class="actions"><label class="switch"><input type="checkbox" id="play-sounds"><span class="track"></span></label></div>
        </div>
      </div>
    </section>

    <!-- Plan -->
    <section class="page" data-page="plan">
      <div class="plans">
        <div class="plan" id="plan-free">
          <div class="plan-head">
            <strong data-i18n="plan.free.name"></strong>
            <span class="plan-badge" data-i18n="plan.current" hidden></span>
          </div>
          <div class="plan-price" data-i18n="plan.free.price"></div>
          <p class="plan-desc" data-i18n="plan.free.desc"></p>
          <ul class="plan-list">
            <li data-i18n="plan.free.f1"></li>
            <li data-i18n="plan.free.f2"></li>
            <li data-i18n="plan.free.f3"></li>
          </ul>
        </div>
        <div class="plan featured" id="plan-pro">
          <div class="plan-head">
            <strong data-i18n="plan.pro.name"></strong>
            <span class="plan-badge" data-i18n="plan.current" hidden></span>
          </div>
          <div class="plan-price" data-i18n="plan.pro.price"></div>
          <p class="plan-desc" data-i18n="plan.pro.desc"></p>
          <ul class="plan-list">
            <li data-i18n="plan.pro.f1"></li>
            <li data-i18n="plan.pro.f2"></li>
            <li data-i18n="plan.pro.f3"></li>
            <li data-i18n="plan.pro.f4"></li>
          </ul>
          <button id="btn-get-pro" class="primary" data-i18n="plan.get"></button>
        </div>
      </div>
      <p class="footnote" data-i18n="plan.soon"></p>

      <div class="card">
        <div class="row stack">
          <div class="label"><strong data-i18n="plan.license"></strong><span id="license-status"></span></div>
          <div class="actions full">
            <input id="license-key" type="text" autocomplete="off" spellcheck="false">
            <button id="btn-activate-license" class="primary" data-i18n="plan.activate"></button>
            <button id="btn-deactivate-license" class="ghost danger" hidden data-i18n="plan.deactivate"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- Modelos -->
    <section class="page" data-page="models">
      <div class="card">
        <div class="card-title" data-i18n="models.provider"></div>
        <div id="provider-chips" class="chips"></div>
        <div class="row stack">
          <div class="label"><strong data-i18n="models.apikey"></strong><span id="key-status"></span></div>
          <div class="actions full">
            <input id="api-key" type="password" autocomplete="off" spellcheck="false">
            <button id="btn-save-key" class="primary" data-i18n="models.save"></button>
            <button id="btn-delete-key" class="ghost danger" hidden data-i18n="models.delete"></button>
          </div>
        </div>
        <p class="hint"><button id="link-key" class="link" data-i18n="models.getkey"></button></p>
      </div>

      <div class="card">
        <div class="card-title" data-i18n="models.model"></div>
        <div id="model-list" class="model-list"></div>
      </div>

      <div class="card">
        <div class="card-title" data-i18n="models.vocab"></div>
        <p class="desc" data-i18n="models.vocab.desc"></p>
        <textarea id="vocabulary" rows="2" spellcheck="false"></textarea>
      </div>

      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="models.cleanup"></strong><span data-i18n="models.cleanup.desc"></span></div>
          <div class="actions"><label class="switch"><input type="checkbox" id="cleanup-enabled"><span class="track"></span></label></div>
        </div>
        <div id="cleanup-options">
          <div class="row">
            <div class="label"><strong data-i18n="models.cleanup.model"></strong><span id="cleanup-model-desc"></span></div>
            <div class="actions"><select id="cleanup-model"></select></div>
          </div>
          <div class="row">
            <div class="label"><strong data-i18n="models.cleanup.prompt"></strong><span data-i18n="models.cleanup.prompt.desc"></span></div>
            <div class="actions">
              <button id="btn-toggle-prompt" class="ghost small"></button>
              <button id="btn-reset-prompt" class="ghost small" data-i18n="models.cleanup.reset"></button>
            </div>
          </div>
          <div id="prompt-editor" class="editor" hidden>
            <textarea id="cleanup-prompt" class="mono" rows="16" spellcheck="false"></textarea>
          </div>
        </div>
      </div>

      <p class="footnote" data-i18n="models.privacy"></p>
    </section>

    <!-- Archivos -->
    <section class="page" data-page="files">
      <div id="dropzone" class="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <strong data-i18n="files.drop"></strong>
        <span class="or" data-i18n="files.or"></span>
        <button id="btn-pick-file" class="primary" data-i18n="files.pick"></button>
        <span class="formats" data-i18n="files.formats"></span>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="files.title"></span>
          <button id="btn-clear-files" class="ghost danger small" data-i18n="files.clear"></button>
        </div>
        <ul id="file-jobs" class="job-list"></ul>
        <p id="files-empty" class="empty" data-i18n="files.empty" hidden></p>
      </div>
    </section>

    <!-- Historial -->
    <section class="page" data-page="history">
      <div class="card">
        <div class="card-head">
          <span class="card-title" data-i18n="history.title"></span>
          <button id="btn-clear-history" class="ghost danger small" data-i18n="history.clear"></button>
        </div>
        <ul id="history" class="history-list"></ul>
        <p id="history-empty" class="empty" data-i18n="history.empty" hidden></p>
      </div>
    </section>

    <!-- Avanzado -->
    <section class="page" data-page="advanced">
      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="advanced.mic"></strong><span data-i18n="advanced.mic.desc"></span></div>
          <div class="actions"><select id="input-device"></select></div>
        </div>
        <div class="row">
          <div class="label"><strong data-i18n="advanced.maxsecs"></strong><span data-i18n="advanced.maxsecs.desc"></span></div>
          <div class="actions"><input type="number" id="max-secs" min="5" max="900" step="5"></div>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="advanced.restore"></strong><span data-i18n="advanced.restore.desc"></span></div>
          <div class="actions"><label class="switch"><input type="checkbox" id="restore-clipboard"><span class="track"></span></label></div>
        </div>
        <div class="row">
          <div class="label"><strong data-i18n="advanced.overlay"></strong><span data-i18n="advanced.overlay.desc"></span></div>
          <div class="actions"><label class="switch"><input type="checkbox" id="show-overlay"><span class="track"></span></label></div>
        </div>
        <div class="row">
          <div class="label"><strong data-i18n="advanced.maxhistory"></strong><span data-i18n="advanced.maxhistory.desc"></span></div>
          <div class="actions"><input type="number" id="max-history" min="1" max="500" step="1"></div>
        </div>
      </div>
    </section>

    <!-- Acerca de -->
    <section class="page" data-page="about">
      <div class="card about-hero">
        <img class="about-icon" src="icon.png" alt="">
        <div class="about-text">
          <strong>Dictámelo</strong>
          <span id="about-version"></span>
        </div>
        <button id="btn-website" class="ghost">dictamelo.com</button>
      </div>
      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="about.uilang"></strong><span data-i18n="about.uilang.desc"></span></div>
          <div class="actions"><select id="ui-language"></select></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" data-i18n="about.permissions"></div>
        <div id="about-perm-rows"></div>
      </div>
      <div class="card">
        <div class="row">
          <div class="label"><strong data-i18n="about.logs"></strong><span data-i18n="about.logs.desc"></span></div>
          <div class="actions"><button id="btn-logs" class="ghost" data-i18n="about.openlogs"></button></div>
        </div>
        <div class="row">
          <div class="label"><strong data-i18n="about.config"></strong><span id="about-config" class="mono"></span></div>
          <div class="actions"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="i18n.js"></script>
<script src="dev-mock.js"></script>
<script src="main.js"></script>
</body>
</html>
